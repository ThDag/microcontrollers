[env:deneyapkart]
platform = espressif32
board = deneyapkart
framework = arduino

monitor_speed = 115200
board_build.partitions = huge_app.csv

lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    https://github.com/lemmingDev/ESP32-BLE-Gamepad.git

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
