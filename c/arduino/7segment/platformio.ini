[platformio]
src_dir = .  ; PlatformIO will now look inside project_root/asm/ instead of src/

[env:uno]
platform = atmelavr
board = uno
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L

upload_protocol = arduino
upload_speed = 115200

; Bypass standard C startup code (crt*.o)
build_flags = -nostartfiles
